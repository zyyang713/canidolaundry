  <!-- JavaScript 切換邏輯 -->
  <script>
    function switchFloor(targetFloor) {
      // 1. 控制樓層區塊的顯示與隱藏
      const sections = document.querySelectorAll('.floor-section');
      sections.forEach(section => {
        if (targetFloor === 'all' || section.dataset.floor === targetFloor) {
          section.classList.remove('hidden');
        } else {
          section.classList.add('hidden');
        }
      });

      // 2. 更新按鈕高亮樣式
      const buttons = document.querySelectorAll('.floor-btn');
      buttons.forEach(btn => {
        btn.className = 'floor-btn bg-slate-100 text-slate-600 px-4 py-2 rounded-xl font-bold hover:bg-slate-200 transition';
      });

      const activeBtn = document.getElementById(`btn-${targetFloor}`);
      if (activeBtn) {
        activeBtn.className = 'floor-btn bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-sm transition hover:opacity-90';
      }
    }
  </script>
